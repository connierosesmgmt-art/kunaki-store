<!DOCTYPE html>
<html>
<head>

<title>Absence and Persistence</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#0f0f0f;
font-family:Arial;
color:white;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
padding:40px;
display:flex;
flex-wrap:wrap;
gap:40px;
}

.cover{
flex:1;
min-width:300px;
}

.cover img{
width:100%;
border-radius:6px;
box-shadow:0 0 30px rgba(0,0,0,.6);
}

.info{
flex:1;
min-width:300px;
}

h1{
font-size:34px;
margin-bottom:10px;
}

.artist{
color:#bbb;
margin-bottom:20px;
}

.price{
font-size:28px;
margin:20px 0;
color:#f4c542;
}

form input, form select{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
background:#e63946;
border:none;
font-size:18px;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#c81d25;
}

.footer{
text-align:center;
padding:30px;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<div class="cover">
<img src="cover.jpg">
</div>

<div class="info">

<h1>Absence and Persistence</h1>

<div class="artist">
An album by Connie Roses & Kondracki
</div>

<div class="price">$10</div>

<p>
Physical CD manufactured via Kunaki.
Ships worldwide.
</p>

<form id="orderForm">

<input type="text" placeholder="Full Name" required>

<input type="text" placeholder="Address" required>

<input type="text" placeholder="City" required>

<input type="text" placeholder="State / Province">

<input type="text" placeholder="ZIP / Postal Code" required>

<input type="text" placeholder="Country" required>

<select>
<option value="1">1 Copy</option>
<option value="2">2 Copies</option>
<option value="3">3 Copies</option>
<option value="4">4 Copies</option>
<option value="5">5 Copies</option>
</select>

<button type="submit">
Place Order
</button>

</form>

</div>

</div>

<div class="footer">

Kunaki Product ID: PX00M10N7C

</div>

<script>

document.getElementById("orderForm").addEventListener("submit", function(e){

e.preventDefault();

alert("Order received. Payment instructions will be sent shortly.");

});

</script>

</body>
</html>
